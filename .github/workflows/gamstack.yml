name: Public Pages — Captain's Diary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Assemble static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/captains-diary
          # Keep existing static GAMstack root/committed output. The legacy
          # generator is independent of the Captain's Diary release page.
          if [ -d output ]; then cp -R output/. _site/; fi
          cp index.html _site/index.html
          cp CNAME _site/CNAME
          cp captains-diary/index.html _site/captains-diary/index.html
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p = Path('_site/captains-diary/index.html')
          html = p.read_text(encoding='utf-8')
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if 'id' in data:
                      assert data['id'] not in self.ids, 'Duplicate ID: ' + data['id']
                      self.ids.add(data['id'])
          check = Check()
          check.feed(html)
          for name in ('mac-link','linux-link','checksum-link','release-status','release-info'):
              assert name in check.ids, 'Missing download component: ' + name
          assert 'api.github.com/repos/' in html, 'Missing release API lookup'
          assert 'id="mac-link" aria-disabled="true"' in html, 'Mac download must start disabled'
          assert 'id="linux-link" aria-disabled="true"' in html, 'Linux download must start disabled'
          assert 'CaptainsDiary-Windows' not in html, 'No Windows download before native E2E'
          assert Path('_site/CNAME').read_text().strip() == 'farmar.io'
          print('PASS: static landing, public release discovery, safe pending state')
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static Pages site
        id: deployment
        uses: actions/deploy-pages@v4
